<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexBox</title>
    <style>
        .container{
            height: 400px;
            width: 100%;
            border: 2px solid black;
            display: flex;
            /* flex-direction: column;
            flex-direction: row-reverse;
            flex-direction:column-reverse ; */
            flex-wrap: wrap;
            overflow: hidden;
        }
        .item{
            background-color: tomato;
            border: 1px solid green;
            padding: 0px;
            margin: 6px;
            width: 92px;
            height: 92px;
        }

    </style>      
</head>
<body>
    <h2>This is flex box</h2>
    <div class="container">
        <div class="item" id="item-1">First</div>
        <div class="item" id="item-2">Second</div>
        <div class="item" id="item-3">Third</div>
        <div class="item" id="item-4">Fourth</div>
        <div class="item" id="item-5">Fifth</div>
        <div class="item" id="item-6">Sixth</div>
    </div>
</body>
</html>
