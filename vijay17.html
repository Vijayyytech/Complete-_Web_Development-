<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
.navbar{
    background-color:black;
    border-radius: 40px;
}
.navbar li{
    float: left;
    list-style: none;
    padding: 10px 10px;
}
.navbar li a{
    text-decoration: none;
    padding: 3px 33px;
    color: bisque;
    margin-left: 55px;
    margin-right: 61px;
}
.navbar li a:hover{
    color: red;
}
.navbar ul{
    overflow: auto;
}
.navbar input{
    margin: 5px 32px;
    padding: 4px 399px;
    border-radius: 20px;
    border: 2px solid black;
    width: 130px;
}
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Help</a></li>
                <div>
                <input type="text" name="search" id="search" placeholder="Search products here">
                </div>
            </ul>
        </nav>
    </header>
</body>
</html>
