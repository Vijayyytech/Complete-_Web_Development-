<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors in css</title>
    <style>
        .firstcls{
            color: blueviolet; /* color by name */
        }
        .secondcls{
            color: rgb(2, 250, 213); /* color by rgb */
        }
        .thirdcls{
            color: goldenrod;
            background-color: #56ffb0; /* color by hex value */
        }
    </style>
</head>
<body>
    <h2>This is css colors</h2>
    <p class="firstcls">This is a normal paragraph and how are you</p>
    <p class="secondcls">This is a normal paragraph and how are you</p>
    <p class="thirdcls">This is a normal paragraph and how are you</p>
</body>
</html>
