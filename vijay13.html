<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>height width borders and background</title>
    <style>
        #myvijju{
            background-color: greenyellow;
            height: 100px;
            width: 455px;
            border: 4px solid green;
            border-radius: 50px;
            align-content: center;
        }
        #localpara{
            background-color: fuchsia;
            font-size: x-large;
            font-weight: bold;
            border-top: 4px solid rgb(0, 255, 213);
            border-bottom: 5px solid rgba(255, 221, 0, 0.956);
            border-top-style: dotted;
            border-top-left-radius: 20px;
            background-image: url();
            background-repeat: no-repeat;
            background-position: top center;
        }
    </style>
</head>
<body>
    <h2>this border</h2>
    <p id="myvijju">Hello everyone i am vijju tripathi</p>
    <h2>this second paragraph</h2>
    <p id="localpara">this is indian movie clip</p>
</body>
</html>
