<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date and Time functions</title>
</head>

<body>
    <h1 id="new"></h1>
    <button onclick="getDate()">Date</button>
    <button onclick="year()">Year</button>
    <button onclick="month()">Month</button>
    <button onclick="time()">Time</button>
</body>
<script>
    var date = new Date();
    function getDate() {
        document.getElementById("new").innerText = date;
    }
    function year() {
        document.getElementById("new").innerText = date.getFullYear();
    }
    function month() {
        var month = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
        document.getElementById("new").innerText = month[date.getMonth()];
    }
    function time(){
        document.getElementById("new").innerText = date.getTime();
    }
    
</script>

</html>
