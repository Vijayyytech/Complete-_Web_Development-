<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo and button decoration</title>
    <style>
     .container{
        background-color: rgb(180, 157, 203);
        border: solid 2px black;
        border-radius: 8px;
        padding: 20px;
        margin: 36px ;
        font-style: italic;
        font-size: large;
        color: rgb(109 17 50);
     }
     a{
       padding: 10px;
       margin: 10px;
       color: black;
       border: 1px;
       border-radius: 10px;
       font-weight: bold;
       text-decoration: none;
       
     }
     button{
        color: black;
        padding: 3px;
        margin:1px ;
        background-color: rgb(163 138 138);
        border: solid 1px;
        border-radius: 10px;
        font-weight: bold;
     }
     button:hover{
        cursor: pointer;
        color: rgb(9, 217, 61);
        background-color: rgb(210, 118, 179);
     }
     a:hover{
       cursor: pointer;
       color: rgb(99, 11, 181);
       background-color: rgb(113, 181, 115);
     }
    </style>
</head>
<body>
    <div class="container" id="cont1">
        <h2>This is decoration</h2>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dicta explicabo ipsum id nihil neque dolores iste rerum, et distinctio dolor obcaecati ex amet omnis quis, blanditiis ullam illum earum. Vel!</p>
        <a href="" >Read more</a>
        <button>contact us</button>
    </div>
</body>
</html>
