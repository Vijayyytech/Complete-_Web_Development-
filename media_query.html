<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
     .heading{
        border: 1px solid green;
        padding: 3px;
        margin: 20px;
        font-size: 50px;
        height: 400px;
        text-align:center ;
        display: none;
     }
     
     @media (max-width:300px) and (min-width:100px){
        #head-1{
          display: block;
          background-color: rgb(99, 6, 229);
        }
     }
      @media (max-width:500px) and (min-width:300px){
        #head-2{
          display: block;
          background-color: rgb(213, 14, 14);
        }
     }
      @media (max-width:800px) and (min-width:500px){
        #head-3{
          display: block;
          background-color: rgb(87, 213, 14);
        }
     }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading" id="head-1">this is first</div>
        <div class="heading" id="head-2">this is second</div>
        <div class="heading" id="head-3">this is third</div>
        <div class="heading" id="head-4">this is fourth</div>
    </div>
</body>
</html>
