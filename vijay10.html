<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <style>
        #firstpara {
            color: rgb(255, 123, 47);
            background-color: black;
        }
         /* class selector */
        .secondpara {
            color: blue;
        }
        /* grouping selector */
        footer, span{
            background-color: forestgreen;
        } 
        /* Id selector */
        #vijju{
            color: salmon;
        }
    </style>
</head>

<body>
    <p id="firstpara">This is a paragraph which introduce css</p>
    <div>
        <p id="vijju">This is iind paragraph</p>
        <span>this is span</span>
    </div>
    <p>This is yet another paragraph for css</p>
    <footer>this is footer</footer>
</body>

</html>
