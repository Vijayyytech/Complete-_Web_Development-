<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt function</title>
</head>
<body>
    Name : <i id="name"></i>
    <br>
    <button onclick="call()" >call</button>
    
</body>
<script>
    function call(){
   var name = prompt("Enter your name"," ");
    //document.write(name);
    document.getElementById("name").innerHTML=name;
    }
</script>
</html>
